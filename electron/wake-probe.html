<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>GAI AI Local Wake Listener</title></head>
<body>
<script>
(() => {
  const TARGET_RATE = 16000;
  const CHUNK = 1600;
  let config = { enabled: true, conversationActive: false };
  let stream = null;
  let context = null;
  let node = null;
  let restartTimer = null;
  let generation = 0;

  const report = (status, detail = '') => window.wakeProbe?.reportStatus(status, detail);
  const shouldListen = () => config.enabled !== false && config.conversationActive !== true;

  async function stop(reason = 'paused') {
    generation += 1;
    if (restartTimer) { clearTimeout(restartTimer); restartTimer = null; }
    try { node?.disconnect(); } catch {}
    try { stream?.getTracks().forEach(track => track.stop()); } catch {}
    try { await context?.close(); } catch {}
    node = null; stream = null; context = null;
    report(reason);
  }

  function retry(message) {
    report('recovering', message);
    if (!shouldListen() || restartTimer) return;
    restartTimer = setTimeout(() => { restartTimer = null; start(); }, 1500);
  }

  async function start() {
    if (!shouldListen() || stream) return;
    const current = ++generation;
    try {
      stream = await navigator.mediaDevices.getUserMedia({ audio: {
        echoCancellation: false, noiseSuppression: false, autoGainControl: false, channelCount: 1,
      }, video: false });
      if (current !== generation || !shouldListen()) { stream.getTracks().forEach(track => track.stop()); stream = null; return; }
      context = new AudioContext();
      if (context.state === 'suspended') await context.resume();
      const sourceRate = context.sampleRate;
      const source = context.createMediaStreamSource(stream);
      const worklet = `
        class GaiWakeResampler extends AudioWorkletProcessor {
          constructor(options) {
            super();
            this.target = 16000;
            this.source = sampleRate;
            this.step = this.source / this.target;
            this.position = 0;
            this.input = [];
            this.output = new Float32Array(${CHUNK});
            this.count = 0;
          }
          process(inputs) {
            const channel = inputs[0] && inputs[0][0];
            if (!channel) return true;
            for (let i = 0; i < channel.length; i++) this.input.push(channel[i]);
            while (this.position + 1 < this.input.length) {
              const left = Math.floor(this.position);
              const fraction = this.position - left;
              this.output[this.count++] = this.input[left] * (1 - fraction) + this.input[left + 1] * fraction;
              this.position += this.step;
              if (this.count >= this.output.length) {
                const chunk = this.output.slice();
                this.port.postMessage(chunk, [chunk.buffer]);
                this.count = 0;
              }
            }
            const consumed = Math.floor(this.position);
            if (consumed > 0) { this.input.splice(0, consumed); this.position -= consumed; }
            return true;
          }
        }
        registerProcessor('gai-wake-resampler', GaiWakeResampler);
      `;
      const url = URL.createObjectURL(new Blob([worklet], { type: 'application/javascript' }));
      await context.audioWorklet.addModule(url);
      URL.revokeObjectURL(url);
      node = new AudioWorkletNode(context, 'gai-wake-resampler', { numberOfInputs: 1, numberOfOutputs: 1 });
      node.port.onmessage = event => window.wakeProbe?.sendPcm(event.data.buffer);
      const silent = context.createGain(); silent.gain.value = 0;
      source.connect(node); node.connect(silent); silent.connect(context.destination);
      stream.getAudioTracks().forEach(track => track.addEventListener('ended', () => { stop('device-ended').then(() => retry('microphone ended')); }, { once: true }));
      context.addEventListener('statechange', () => { if (context?.state === 'closed' && shouldListen()) retry('audio context closed'); });
      report('running', `source=${sourceRate} target=${TARGET_RATE}`);
    } catch (error) {
      await stop('error');
      retry(error?.message || String(error));
    }
  }

  async function apply(next) {
    config = { ...config, ...(next || {}) };
    if (shouldListen()) await start(); else await stop(config.enabled === false ? 'disabled' : 'conversation-active');
  }

  window.wakeProbe?.onConfig(apply);
  window.wakeProbe?.getConfig().then(apply).catch(() => apply(config));
  setInterval(() => {
    if (shouldListen() && (!stream || !stream.active || context?.state === 'closed')) retry('health check restart');
    else if (stream) report('heartbeat', context?.state || 'unknown');
  }, 15000);
})();
</script>
</body>
</html>
