name: Build installers

on:
  workflow_dispatch:
  pull_request:
  push:
    tags:
      - 'community-v*'

permissions:
  contents: write

jobs:
  release-safety:
    name: Release safety check
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Reject tracked local credentials
        run: npm run check:release-safety

  windows:
    name: Windows x64 installer
    needs: release-safety
    runs-on: windows-2022
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Windows installer
        run: npm run build:win

      - name: Create Windows checksums
        shell: pwsh
        run: |
          $lines = Get-ChildItem dist/*.exe | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)"
          }
          $lines | Set-Content -Encoding utf8 dist/SHA256SUMS-windows.txt

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: BaiLONGMAMy-windows-x64
          path: |
            dist/*.exe
            dist/SHA256SUMS-windows.txt
          if-no-files-found: error

  macos:
    name: macOS ${{ matrix.arch }} DMG
    needs: release-safety
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: macos-15-intel
          - arch: arm64
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build macOS DMG
        run: npm run build:mac:${{ matrix.arch }}

      - name: Create macOS checksum
        run: shasum -a 256 dist/*.dmg > dist/SHA256SUMS-macos-${{ matrix.arch }}.txt

      - name: Upload macOS DMG
        uses: actions/upload-artifact@v4
        with:
          name: BaiLONGMAMy-macos-${{ matrix.arch }}
          path: |
            dist/*.dmg
            dist/SHA256SUMS-macos-${{ matrix.arch }}.txt
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/community-v')
    needs:
      - windows
      - macos
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Download installers
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create combined checksums
        working-directory: release-assets
        run: sha256sum *.exe *.dmg > SHA256SUMS.txt

      - name: Create or update release
        shell: bash
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release-assets/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$GITHUB_REF_NAME" release-assets/* \
              --repo "$GITHUB_REPOSITORY" \
              --generate-notes \
              --title "BaiLONGMAMy $GITHUB_REF_NAME"
          fi
