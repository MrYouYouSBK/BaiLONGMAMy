name: Build installers

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release-safety:
    name: Release safety check
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Reject tracked local credentials
        run: npm run check:release-safety

  unit-tests:
    name: Offline and configuration tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Verify GAI AI 3.3 runtime
        run: |
          npm run test:offline
          npm run test:config-upgrade
          npm run test:voice-continuous
          npm run test:gai-v31
          npm run test:gai-v32
          npm run test:local-ai
          npm run test:community-updater
          npm run test:websocket-security

  windows:
    name: Windows x64 installer
    needs:
      - release-safety
      - unit-tests
    runs-on: windows-2022
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Windows installer
        run: npm run build:win

      - name: Create Windows checksums
        shell: pwsh
        run: |
          $lines = Get-ChildItem dist/*.exe | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)"
          }
          $lines | Set-Content -Encoding utf8 dist/SHA256SUMS-windows.txt

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: GAI-AI-windows-x64
          path: |
            dist/*.exe
            dist/*.exe.blockmap
            dist/latest.yml
            dist/SHA256SUMS-windows.txt
          if-no-files-found: error

  macos:
    name: macOS ${{ matrix.arch }} trusted DMG
    needs:
      - release-safety
      - unit-tests
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: macos-15-intel
          - arch: arm64
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    env:
      GAI_REQUIRE_MAC_SIGNING: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && 'true' || 'false' }}
      CSC_LINK: ${{ secrets.MAC_CERTIFICATE_BASE64 }}
      CSC_KEY_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER_ID }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Require Apple trust credentials for publishable builds
        if: env.GAI_REQUIRE_MAC_SIGNING == 'true'
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        shell: bash
        run: |
          missing=()
          [[ -n "$CSC_LINK" ]] || missing+=(MAC_CERTIFICATE_BASE64)
          [[ -n "$CSC_KEY_PASSWORD" ]] || missing+=(MAC_CERTIFICATE_PASSWORD)
          [[ -n "$APPLE_API_KEY_P8" ]] || missing+=(APPLE_API_KEY_P8)
          [[ -n "$APPLE_API_KEY_ID" ]] || missing+=(APPLE_API_KEY_ID)
          [[ -n "$APPLE_API_ISSUER" ]] || missing+=(APPLE_API_ISSUER_ID)
          if (( ${#missing[@]} )); then
            echo "Refusing to publish an unsigned macOS build. Missing GitHub Secrets: ${missing[*]}" >&2
            exit 1
          fi
          key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          printf '%s' "$APPLE_API_KEY_P8" > "$key_path"
          chmod 600 "$key_path"
          echo "APPLE_API_KEY=$key_path" >> "$GITHUB_ENV"
          echo "CSC_IDENTITY_AUTO_DISCOVERY=true" >> "$GITHUB_ENV"

      - name: Disable signing only for non-publishable PR smoke builds
        if: env.GAI_REQUIRE_MAC_SIGNING != 'true'
        run: echo "CSC_IDENTITY_AUTO_DISCOVERY=false" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm ci

      - name: Build macOS DMG
        run: npm run build:mac:${{ matrix.arch }}

      - name: Notarize and staple publishable DMG
        if: env.GAI_REQUIRE_MAC_SIGNING == 'true'
        run: npm run notarize:mac -- ${{ matrix.arch }}

      - name: Verify architecture, Developer ID, Gatekeeper and launch
        run: npm run verify:mac -- ${{ matrix.arch }}

      - name: Preserve architecture-specific update metadata
        run: mv dist/latest-mac.yml dist/latest-${{ matrix.arch }}-mac.yml

      - name: Create macOS checksum
        run: shasum -a 256 dist/GAI-AI-*-mac-${{ matrix.arch }}.dmg > dist/SHA256SUMS-macos-${{ matrix.arch }}.txt

      - name: Upload macOS DMG
        uses: actions/upload-artifact@v4
        with:
          name: GAI-AI-macos-${{ matrix.arch }}
          path: |
            dist/GAI-AI-*-mac-${{ matrix.arch }}.dmg
            dist/GAI-AI-*-mac-${{ matrix.arch }}.dmg.blockmap
            dist/GAI-AI-*-mac-${{ matrix.arch }}.zip
            dist/GAI-AI-*-mac-${{ matrix.arch }}.zip.blockmap
            dist/latest-${{ matrix.arch }}-mac.yml
            dist/SHA256SUMS-macos-${{ matrix.arch }}.txt
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - windows
      - macos
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Resolve release tag
        id: version
        shell: bash
        run: |
          version=$(node -p "JSON.parse(require('fs').readFileSync('package.json', 'utf8')).version")
          echo "tag=community-v${version}" >> "$GITHUB_OUTPUT"

      - name: Download installers
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create combined checksums
        working-directory: release-assets
        run: sha256sum *.exe *.dmg *.zip > SHA256SUMS.txt

      - name: Create or update release
        shell: bash
        run: |
          release_tag="${{ steps.version.outputs.tag }}"
          if gh release view "$release_tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$release_tag" release-assets/* --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$release_tag" --notes-file RELEASE_NOTES_3.3.md --title "GAI AI 3.3.0" --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$release_tag" release-assets/* \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --notes-file RELEASE_NOTES_3.3.md \
              --title "GAI AI 3.3.0"
          fi
